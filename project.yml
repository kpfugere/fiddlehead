name: Fiddlehead
options:
  bundleIdPrefix: com.kylefugere
  deploymentTarget:
    macOS: "14.0"
  minimumXcodeGenVersion: "2.38"
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Debug:
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGN_STYLE: Manual
      ENABLE_HARDENED_RUNTIME: false
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application"
      CODE_SIGN_STYLE: Manual
      DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
      ENABLE_HARDENED_RUNTIME: true
      OTHER_CODE_SIGN_FLAGS: "--options runtime"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.4"

targets:
  Fiddlehead:
    type: application
    platform: macOS
    sources:
      - path: Fiddlehead
        excludes:
          - "**/*.entitlements"
          - "Resources/Fonts/**"
      - path: Fiddlehead/Resources/Fonts
        buildPhase: resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kylefugere.Fiddlehead
        INFOPLIST_FILE: Fiddlehead/Info.plist
        CODE_SIGN_ENTITLEMENTS: Fiddlehead/Fiddlehead.entitlements
        PRODUCT_NAME: Fiddlehead
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - package: Sparkle

  FiddleheadTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FiddleheadTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kylefugere.FiddleheadTests
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: Fiddlehead
