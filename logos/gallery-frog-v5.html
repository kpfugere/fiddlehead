<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fiddlehead — Frog Peeking v5</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    padding: 60px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 1.6em; font-weight: 300; margin-bottom: 8px; color: #fff; letter-spacing: 0.08em; text-transform: uppercase; }
  .subtitle { font-size: 0.85em; color: #555; margin-bottom: 56px; }
  .section { margin-bottom: 48px; text-align: center; }
  .section h2 { font-size: 0.75em; color: #444; text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 20px; }
  .row { display: flex; align-items: flex-end; justify-content: center; gap: 48px; margin-bottom: 20px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .item img { border-radius: 6px; }
  .item .label { font-size: 0.65em; color: #444; }
  .menubar { display: inline-flex; align-items: center; background: #1a1a1a; border-radius: 8px; padding: 6px 20px; gap: 14px; border: 1px solid #222; }
  .menubar .dot { width: 7px; height: 7px; border-radius: 50%; background: #333; }
  .comparison { display: flex; gap: 32px; justify-content: center; }
  .comp-box { width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; border-radius: 14px; border: 1px solid #222; }
  .comp-box.dark { background: #111; }
  .comp-box.light { background: #f0f0f0; }
  .inverted { filter: invert(1); }
</style>
</head>
<body>
  <h1>Fiddlehead</h1>
  <p class="subtitle">Frog Peeking — Solid Fill</p>

  <div class="section">
    <h2>Scale</h2>
    <div class="row">
      <div class="item"><img src="frog-v5-peeking.svg" width="128" height="128"><span class="label">128px</span></div>
      <div class="item"><img src="frog-v5-peeking.svg" width="96" height="96"><span class="label">96px</span></div>
      <div class="item"><img src="frog-v5-peeking.svg" width="64" height="64"><span class="label">64px</span></div>
      <div class="item"><img src="frog-v5-peeking.svg" width="48" height="48"><span class="label">48px</span></div>
      <div class="item"><img src="frog-v5-peeking.svg" width="32" height="32"><span class="label">32px</span></div>
      <div class="item"><img src="frog-v5-peeking.svg" width="22" height="22"><span class="label">22px</span></div>
      <div class="item"><img src="frog-v5-peeking.svg" width="16" height="16"><span class="label">16px</span></div>
    </div>
  </div>

  <div class="section">
    <h2>Menu Bar</h2>
    <div class="menubar">
      <div class="dot"></div>
      <div class="dot"></div>
      <img src="frog-v5-peeking.svg" width="18" height="18">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <div class="section">
    <h2>Dark vs Light</h2>
    <div class="comparison">
      <div class="comp-box dark"><img src="frog-v5-peeking.svg" width="110" height="110"></div>
      <div class="comp-box light"><img src="frog-v5-peeking.svg" width="110" height="110" class="inverted"></div>
    </div>
  </div>
</body>
</html>
