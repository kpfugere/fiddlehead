<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <rect width="128" height="128" rx="28" fill="#111111"/>
  <!-- Frog peeking up from bottom - just eyes and top of head visible -->
  <!-- Water line / edge -->
  <line x1="16" y1="82" x2="112" y2="82" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <!-- Head dome peeking above -->
  <path d="M 30 82 Q 30 58, 64 58 Q 98 58, 98 82" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <!-- Left eye bulge -->
  <circle cx="44" cy="52" r="14" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <circle cx="44" cy="52" r="4.5" fill="#FFFFFF"/>
  <!-- Right eye bulge -->
  <circle cx="84" cy="52" r="14" fill="none" stroke="#FFFFFF" stroke-width="5"/>
  <circle cx="84" cy="52" r="4.5" fill="#FFFFFF"/>
</svg>