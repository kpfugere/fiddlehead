<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Fiddlehead — Monogram F Curl v2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    padding: 60px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 {
    font-size: 1.6em;
    font-weight: 300;
    margin-bottom: 8px;
    color: #fff;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .subtitle {
    font-size: 0.85em;
    color: #555;
    margin-bottom: 56px;
  }

  .showcase {
    display: flex;
    align-items: flex-end;
    gap: 48px;
    margin-bottom: 64px;
  }
  .showcase-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .showcase-item img {
    border-radius: 8px;
  }
  .showcase-item .label {
    font-size: 0.7em;
    color: #444;
    letter-spacing: 0.05em;
  }

  .context-section {
    margin-bottom: 48px;
    text-align: center;
  }
  .context-section h2 {
    font-size: 0.75em;
    color: #444;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 20px;
  }

  /* Menubar mockup */
  .menubar {
    display: inline-flex;
    align-items: center;
    background: #1a1a1a;
    border-radius: 8px;
    padding: 6px 20px;
    gap: 14px;
    border: 1px solid #222;
  }
  .menubar .dot { width: 7px; height: 7px; border-radius: 50%; background: #333; }
  .menubar .active { background: #fff; }
  .menubar img { border-radius: 3px; }

  /* Light/dark comparison */
  .comparison {
    display: flex;
    gap: 32px;
    align-items: center;
  }
  .comp-box {
    width: 200px;
    height: 200px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 16px;
    border: 1px solid #222;
  }
  .comp-box.dark { background: #111; }
  .comp-box.light { background: #f5f5f5; }
  .comp-box img { border-radius: 12px; }

  /* Inverted version for light backgrounds */
  .inverted {
    filter: invert(1);
  }
</style>
</head>
<body>
  <h1>Fiddlehead</h1>
  <p class="subtitle">Monogram F Curl &mdash; Single Vertical Fiddlehead</p>

  <!-- Size showcase -->
  <div class="context-section">
    <h2>Scale Test</h2>
    <div class="showcase">
      <div class="showcase-item">
        <img src="08-monogram-f-curl-v2.svg" width="128" height="128">
        <span class="label">128px</span>
      </div>
      <div class="showcase-item">
        <img src="08-monogram-f-curl-v2.svg" width="96" height="96">
        <span class="label">96px</span>
      </div>
      <div class="showcase-item">
        <img src="08-monogram-f-curl-v2.svg" width="64" height="64">
        <span class="label">64px</span>
      </div>
      <div class="showcase-item">
        <img src="08-monogram-f-curl-v2.svg" width="48" height="48">
        <span class="label">48px</span>
      </div>
      <div class="showcase-item">
        <img src="08-monogram-f-curl-v2.svg" width="32" height="32">
        <span class="label">32px</span>
      </div>
      <div class="showcase-item">
        <img src="08-monogram-f-curl-v2.svg" width="22" height="22">
        <span class="label">22px</span>
      </div>
      <div class="showcase-item">
        <img src="08-monogram-f-curl-v2.svg" width="16" height="16">
        <span class="label">16px</span>
      </div>
    </div>
  </div>

  <!-- Menubar mockup -->
  <div class="context-section">
    <h2>macOS Menu Bar</h2>
    <div class="menubar">
      <div class="dot"></div>
      <div class="dot"></div>
      <img src="08-monogram-f-curl-v2.svg" width="18" height="18" class="active">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <!-- Light vs Dark -->
  <div class="context-section">
    <h2>On Dark vs Light Backgrounds</h2>
    <div class="comparison">
      <div class="comp-box dark">
        <img src="08-monogram-f-curl-v2.svg" width="120" height="120">
      </div>
      <div class="comp-box light">
        <img src="08-monogram-f-curl-v2.svg" width="120" height="120" class="inverted">
      </div>
    </div>
  </div>

</body>
</html>
